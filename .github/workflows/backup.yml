name: Backup do banco de dados

on:
  schedule:
    - cron: '0 6 * * *' # todo dia às 06:00 UTC (03:00 horário de Brasília)
  workflow_dispatch:

jobs:
  trigger-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar backup por e-mail
        run: |
          curl -sf -X POST "https://autoelite.infinityfree.me/api_backup.php" \
            -H "X-Backup-Secret: ${{ secrets.BACKUP_SECRET }}"
